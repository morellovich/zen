services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: zenadmin
      POSTGRES_PASSWORD: temp
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres: {}
