<div class="p-3">
  <button type="button" mat-raised-button color="primary" (click)="msgToServer()">Send</button>

  <div class="mt-3">
    <span class="badge" [class.bg-success]="connected()" [class.bg-danger]="!connected()">
      {{ connected() ? 'connected' : 'disconnected' }}
    </span>
  </div>

  <ul class="mt-3 list-unstyled" data-testid="socket-messages">
    @for (message of messages(); track $index) {
      <li><code>{{ message }}</code></li>
    } @empty {
      <li class="text-muted">No messages received yet</li>
    }
  </ul>
</div>
